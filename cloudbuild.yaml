steps:
  # 1️⃣ Limpiar dist e instalar dependencias
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        rm -rf dist/
        npm install

  # 2️⃣ Build Angular producción
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm run build -- --configuration production

  # 3️⃣ Ajustar rutas en index.html para bucket
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i 's|<base href="/">|<base href="/forestplus-angular-frontend/">|' dist/forest-plus/browser/index.html
        sed -i 's|href="assets/|href="/forestplus-angular-frontend/assets/|g' dist/forest-plus/browser/index.html
        sed -i 's|src="assets/|src="/forestplus-angular-frontend/assets/|g' dist/forest-plus/browser/index.html

  # 4️⃣ Subir contenido al bucket
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gsutil'
      - '-m'
      - 'rsync'
      - '-r'
      - '-c'
      - '-d'
      - 'dist/forest-plus/browser/'
      - 'gs://forestplus-angular-frontend'

  # 5️⃣ Forzar permisos públicos
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gsutil'
      - '-m'
      - 'acl'
      - 'ch'
      - '-r'
      - '-u'
      - 'AllUsers:R'
      - 'gs://forestplus-angular-frontend'

  # 6️⃣ Configurar bucket como hosting de SPA
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gsutil'
      - 'web'
      - 'set'
      - '-m'
      - 'index.html'
      - '-e'
      - 'index.html'
      - 'gs://forestplus-angular-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
