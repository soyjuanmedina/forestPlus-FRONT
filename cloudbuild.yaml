steps:
  # 1️⃣ Instalar dependencias con Node 20
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install

  # 2️⃣ Build Angular en producción con baseHref
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm run build:prod

  # 3️⃣ Subir la carpeta dist al bucket GCS
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gsutil'
      - '-m'
      - 'rsync'
      - '-r'
      - '-c'
      - '-d'
      - 'dist/forest-plus/browser/'   # barra final importante
      - 'gs://forestplus-angular-frontend'

  # 4️⃣ Forzar permisos públicos
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gsutil'
      - '-m'
      - 'acl'
      - 'ch'
      - '-r'
      - '-u'
      - 'AllUsers:R'
      - 'gs://forestplus-angular-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
