steps:
  # 1️⃣ Instalar dependencias con Node 20
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install

  # 2️⃣ Build Angular en producción
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm run build -- --configuration production

  # 3️⃣ Subir la carpeta dist al bucket GCS
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gsutil'
      - '-m'
      - 'rsync'
      - '-r'
      - '-c'
      - '-d'
      - 'dist/forest-plus/browser/'
      - 'gs://forestplus-angular-frontend'

# Opcional: ver logs solo en Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY
