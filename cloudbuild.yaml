steps:
  # 1️⃣ Instalar dependencias con Node 20
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install

  # 2️⃣ Build Angular en producción
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm run build -- --configuration production

  # 3️⃣ Subir la carpeta dist al bucket GCS
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gsutil'
      - '-m'
      - 'rsync'
      - '-r'
      - '-c'
      - '-d'
      - 'dist/forest-plus/browser/'   # barra final importante
      - 'gs://forestplus-angular-frontend'

  # 4️⃣ Forzar permisos públicos
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gsutil'
      - '-m'
      - 'acl'
      - 'ch'
      - '-r'
      - '-u'
      - 'AllUsers:R'
      - 'gs://forestplus-angular-frontend'

  # 5️⃣ Ajustar tipos MIME
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gsutil -m setmeta -h "Content-Type:text/html" gs://forestplus-angular-frontend/index.html
        gsutil -m setmeta -h "Content-Type:text/javascript" gs://forestplus-angular-frontend/*.js
        gsutil -m setmeta -h "Content-Type:text/css" gs://forestplus-angular-frontend/*.css

options:
  logging: CLOUD_LOGGING_ONLY
