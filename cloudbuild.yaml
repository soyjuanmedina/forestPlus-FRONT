steps:
  # 1️⃣ Limpiar dist e instalar dependencias
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        rm -rf dist/
        npm install

  # 2️⃣ Build Angular producción
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm run build -- --configuration production

  # 3️⃣ Reemplazar <base href="/"> por la ruta correcta
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i 's|<base href="/">|<base href="/"|g' dist/forest-plus/browser/index.html
        sed -i 's|href="assets/|href="/assets/|g' dist/forest-plus/browser/index.html
        sed -i 's|src="assets/|src="/assets/|g' dist/forest-plus/browser/index.html

  # 4️⃣ Subir contenido de browser/ al bucket raíz
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gsutil'
      - '-m'
      - 'rsync'
      - '-r'
      - '-c'
      - '-d'
      - 'dist/forest-plus/browser/'
      - 'gs://app.forestplustech.com'

options:
  logging: CLOUD_LOGGING_ONLY
