<mat-card class="p-4">
  <div class="flex justify-between items-center mb-4">
    <input type="text" placeholder="{{ 'TREE_LIST.SEARCH_PLACEHOLDER' | translate }}"
      [(ngModel)]="filterText" (keyup)="applyFilter()"
      class="w-64 rounded-xl border border-gray-300 px-4 py-2 shadow-sm
             focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" />
  </div>

  <div class="flex flex-col gap-4">
    <div *ngFor="let tree of getPagedTrees()"
      class="border rounded p-4 shadow-sm flex justify-between items-center w-full transition"
      [ngClass]="{
        'border-green-600 bg-green-50': tree.ownerUserName || tree.ownerCompanyName
      }">

      <!-- Datos -->
      <div class="flex flex-col text-left">

        <div class="font-semibold text-lg">
          {{ 'TREE_LIST.ID' | translate }}: {{ tree.id }}
        </div>

        <div class="text-gray-600">
          {{ 'TREE_LIST.TYPE' | translate }}: {{ tree.treeTypeName }}
        </div>

        <div class="text-gray-500 text-sm">
          {{ 'TREE_LIST.PLANTED_AT' | translate }}: {{ tree.plantedAt | date }}
        </div>

        <!-- PROPIETARIO CON LINK A PERFIL -->
        <div *ngIf="tree.ownerUserName || tree.ownerCompanyName"
          class="mt-2 p-2 bg-green-100 border border-green-500 rounded-lg text-green-800 text-sm flex items-center gap-1">
          <strong>{{ 'TREE_LIST.OWNER' | translate }}:</strong>

          <!-- Usuario propietario -->
          <button *ngIf="tree.ownerUserId" class="text-green-700 underline hover:text-green-900"
            (click)="goToUser(tree.ownerUserId)">
            {{ tree.ownerUserName }}
          </button>

          <!-- Empresa propietaria -->
          <button *ngIf="tree.ownerCompanyId" class="text-green-700 underline hover:text-green-900"
            (click)="goToCompany(tree.ownerCompanyId)">
            {{ tree.ownerCompanyName }}
          </button>
        </div>

      </div>

      <!-- Acciones -->
      <div class="flex gap-2">

        <!-- (Editar si lo activas más adelante)
        <button
          (click)="openEditModal(tree)"
          class="bg-green-600 hover:bg-green-700 text-white rounded-full p-2 flex items-center justify-center">
          <mat-icon class="text-white" style="font-size: 20px;">edit</mat-icon>
        </button>
        -->

        <button (click)="deleteTree(tree)"
          class="bg-red-500 hover:bg-red-600 text-white rounded-full p-2 flex items-center justify-center">
          <mat-icon class="text-white" style="font-size: 20px;">delete</mat-icon>
        </button>

      </div>

    </div>
  </div>

  <!-- Paginación -->
  <div class="mt-6 flex justify-center items-center gap-4">
    <button (click)="previousPage()" [disabled]="currentPage === 0"
      class="flex items-center justify-center gap-2 bg-green-600 text-white py-2 px-4 rounded-xl hover:bg-green-700 disabled:opacity-50 transition">
      <mat-icon>chevron_left</mat-icon>
      {{ 'COMMON.PREVIOUS' | translate }}
    </button>

    <span class="text-gray-700 font-medium">
      {{ currentPage + 1 }} / {{ totalPages }}
    </span>

    <button (click)="nextPage()" [disabled]="currentPage + 1 >= totalPages"
      class="flex items-center justify-center gap-2 bg-green-600 text-white py-2 px-4 rounded-xl hover:bg-green-700 disabled:opacity-50 transition">
      {{ 'COMMON.NEXT' | translate }}
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</mat-card>
