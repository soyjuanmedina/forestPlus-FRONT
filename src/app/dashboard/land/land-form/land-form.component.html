<div class="w-full max-w-full mx-auto bg-white p-6 rounded-2xl shadow-lg">
  <form [formGroup]="landForm" (ngSubmit)="onSubmitLand()">
    <h1 class="text-2xl font-bold mb-6 text-center">
      {{ land?.id ? ('LAND_FORM.TITLE_EDIT' | translate) : ('LAND_FORM.TITLE_NEW' | translate) }}
    </h1>

    <!-- 🖼 Imagen del terreno -->
    <div class="flex flex-col items-center mb-6">
      <img [src]="previewImage || 'assets/logo-white.png'" alt="Imagen del terreno"
        class="w-24 h-24 rounded-full shadow-lg mb-2 object-cover" />
      <label
        class="cursor-pointer bg-gray-200 hover:bg-gray-300 p-2 rounded-full flex items-center gap-2">
        <span class="material-icons">photo_camera</span>
        <span>{{ 'LAND_FORM.SELECT_IMAGE' | translate }}</span>
        <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
      </label>
    </div>

    <!-- Campos básicos -->
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <div class="flex-1">
        <label class="block text-gray-700 font-medium mb-1">{{ 'LAND_FORM.NAME_LABEL' | translate
          }}</label>
        <input type="text" formControlName="name" required
          class="w-full rounded-xl border border-gray-300 px-4 py-2 shadow-sm
                 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
          placeholder="{{ 'LAND_FORM.NAME_PLACEHOLDER' | translate }}" />
      </div>

      <div class="flex-1">
        <label class="block text-gray-700 font-medium mb-1">{{ 'LAND_FORM.LOCATION_LABEL' |
          translate }}</label>
        <input type="text" formControlName="location"
          class="w-full rounded-xl border border-gray-300 px-4 py-2 shadow-sm
                 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
          placeholder="{{ 'LAND_FORM.LOCATION_PLACEHOLDER' | translate }}" />
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <div class="flex-1">
        <label class="block text-gray-700 font-medium mb-1">{{ 'LAND_FORM.AREA_LABEL' | translate
          }}</label>
        <input type="number" formControlName="area" required
          class="w-full rounded-xl border border-gray-300 px-4 py-2 shadow-sm
                 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
          placeholder="{{ 'LAND_FORM.AREA_PLACEHOLDER' | translate }}" />
      </div>

      <div class="flex-1">
        <label class="block text-gray-700 font-medium mb-1">{{ 'LAND_FORM.MAX_TREES_LABEL' |
          translate }}</label>
        <input type="number" formControlName="maxTrees"
          class="w-full rounded-xl border border-gray-300 px-4 py-2 shadow-sm
                 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
          placeholder="{{ 'LAND_FORM.MAX_TREES_PLACEHOLDER' | translate }}" />
      </div>
    </div>

    <!-- Botones principales -->
    <div class="flex justify-end gap-4 mt-6">
      <button type="button" (click)="cancel()"
        class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-xl hover:bg-gray-400 transition">
        {{ 'LAND_FORM.CANCEL_BUTTON' | translate }}
      </button>
      <button type="submit"
        class="flex-1 bg-green-600 text-white py-3 rounded-xl hover:bg-green-700 disabled:opacity-50 transition">
        {{ land?.id ? ('LAND_FORM.SUBMIT_EDIT' | translate) : ('LAND_FORM.SUBMIT_NEW' | translate)
        }}
      </button>
    </div>

    <!-- Coordenadas -->
    <div class="mt-6 w-full text-left">
      <div class="flex justify-between items-center mb-4">
        <p class="font-semibold text-gray-700">
          {{ 'LANDS.COORDINATES' | translate }}
        </p>
        <button type="button" (click)="openAddCoordinateModal()"
          class="bg-blue-200 text-blue-800 px-3 py-1 rounded-full hover:bg-blue-300 transition text-sm">
          {{ 'LAND_FORM.ADD_COORDINATE' | translate }}
        </button>
      </div>

      <!-- GRID DE CARDS -->
      <div *ngIf="coordinates?.length; else noCoordinates"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

        <div *ngFor="let coord of coordinates"
          class="bg-white rounded-xl shadow-sm border p-4 flex flex-col justify-between">

          <div class="text-sm text-gray-700 mb-3">
            <p><span class="font-semibold">Lat:</span> {{ coord.latitude | number:'1.6-6' }}</p>
            <p><span class="font-semibold">Lng:</span> {{ coord.longitude | number:'1.6-6' }}</p>
          </div>

          <!-- BOTONES -->

          <div class="flex justify-end">
            <button type="button" (click)="deleteCoordinate(coord)" class="bg-red-500 hover:bg-red-600 text-white rounded-full
                     w-10 h-10 flex items-center justify-center
                     transition">
              <mat-icon class="text-white" style="font-size: 20px;">delete</mat-icon>
            </button>
          </div>



        </div>
      </div>

      <ng-template #noCoordinates>
        <p class="text-gray-400">
          {{ 'LANDS.NO_COORDINATES' | translate }}
        </p>
      </ng-template>
    </div>

    <!-- Plantaciones planificadas -->
    <div class="mt-6 w-full">
      <app-planned-plantations-list [plantations]="plannedPlantations" [editable]="true"
        (edit)="onEditPlantation($event)">
      </app-planned-plantations-list>
    </div>

  </form>
</div>
