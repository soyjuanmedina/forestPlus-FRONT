<mat-card class="p-4">
  <div class="flex justify-between items-center mb-4">
    <input type="text" placeholder="Buscar usuario..." (keyup)="applyFilter($event)"
      class="border rounded px-3 py-2 w-64" />
    <button mat-raised-button color="accent" (click)="addUser()">
      <mat-icon class="mr-1">add</mat-icon>
      Nuevo usuario
    </button>
  </div>

  <div class="flex flex-col gap-4">
    <div *ngFor="let user of users.data"
      class="border rounded p-4 shadow-sm flex justify-between items-center w-full">

      <!-- Texto a la izquierda -->
      <div class="flex flex-col text-left">
        <div class="font-semibold text-lg">{{ user.name }} {{ user.surname }}</div>
        <div class="text-gray-600">{{ user.email }}</div>
        <div class="text-gray-500">{{ user.role || '—' }}</div>
      </div>

      <!-- Botones a la derecha -->
      <div class="flex gap-2">
        <button mat-mini-fab (click)="onView(user)"
          class="bg-green-500 hover:bg-green-600 text-white">
          <mat-icon>visibility</mat-icon>
        </button>
        <!-- Editar: verde -->
        <button mat-mini-fab (click)="onEdit(user)"
          class="bg-green-500 hover:bg-green-600 text-white">
          <mat-icon>edit</mat-icon>
        </button>

        <!-- Eliminar: rojo suave -->
        <button mat-mini-fab (click)="onDelete(user)"
          class="bg-red-400 hover:bg-red-500 text-white">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="mt-4 flex justify-center items-center gap-2">
    <button mat-stroked-button (click)="previousPage()" [disabled]="currentPage === 0">
      Anterior
    </button>
    <span>{{ currentPage + 1 }} / {{ totalPages }}</span>
    <button mat-stroked-button (click)="nextPage()" [disabled]="currentPage + 1 >= totalPages">
      Siguiente
    </button>
  </div>
</mat-card>
