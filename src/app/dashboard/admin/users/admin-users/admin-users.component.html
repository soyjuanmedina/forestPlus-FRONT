<mat-card class="p-4">
  <div class="flex justify-between items-center mb-4">
    <input type="text" placeholder="{{ 'ADMIN_USERS.SEARCH_PLACEHOLDER' | translate }}"
      [(ngModel)]="filterText" (keyup)="applyFilter()"
      class="w-64 rounded-xl border border-gray-300 px-4 py-2 shadow-sm
                  focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" />

    <button (click)="addUser()"
      class="flex items-center justify-center gap-2 bg-green-600 text-white py-3 px-4 rounded-xl hover:bg-green-700 disabled:opacity-50 transition">
      <mat-icon>add</mat-icon>
      {{ 'ADMIN_USERS.ADD_BUTTON' | translate }}
    </button>
  </div>

  <div class="flex flex-col gap-4" *ngIf="getPagedUsers()?.length">
    <div *ngFor="let user of getPagedUsers()"
      class="border rounded p-4 shadow-sm flex justify-between items-center w-full"
      [ngClass]="{'border-red-500 bg-red-50': (user.pendingTreesCount ?? 0) > 0}">

      <!-- Datos del usuario -->
      <div class="flex flex-col text-left">
        <div class="font-semibold text-lg flex items-center gap-2">
          {{ user.name }} {{ user.surname }}
          <!-- Badge de árboles pendientes -->
          <span *ngIf="(user.pendingTreesCount ?? 0) > 0"
            class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full">
            {{ user.pendingTreesCount }}
          </span>
        </div>
        <div class="text-gray-600">{{ user.email }}</div>
        <div class="text-gray-500">{{ user.role || '—' }}</div>
      </div>

      <!-- Botones -->
      <div class="flex gap-2">
        <button (click)="onView(user)"
          class="bg-green-600 hover:bg-green-700 text-white rounded-full p-2 flex items-center justify-center">
          <mat-icon class="text-white" style="font-size: 20px;">visibility</mat-icon>
        </button>

        <button (click)="onEdit(user)"
          class="bg-green-600 hover:bg-green-700 text-white rounded-full p-2 flex items-center justify-center">
          <mat-icon class="text-white" style="font-size: 20px;">edit</mat-icon>
        </button>

        <button (click)="onDelete(user)"
          class="bg-red-600 hover:bg-red-700 text-white rounded-full p-2 flex items-center justify-center">
          <mat-icon class="text-white" style="font-size: 20px;">delete</mat-icon>
        </button>
      </div>
    </div>
  </div>


  <div class="mt-6 flex justify-center items-center gap-4">
    <button (click)="previousPage()" [disabled]="currentPage === 0"
      class="flex items-center justify-center gap-2 bg-green-600 text-white py-2 px-4 rounded-xl hover:bg-green-700 disabled:opacity-50 transition">
      <mat-icon>chevron_left</mat-icon>
      {{ 'ADMIN_USERS.PAGINATION.PREVIOUS' | translate }}
    </button>

    <span class="text-gray-700 font-medium">
      {{ 'ADMIN_USERS.PAGINATION.PAGE_INFO' | translate:{ current: currentPage + 1, total:
      totalPages } }}
    </span>

    <button (click)="nextPage()" [disabled]="currentPage + 1 >= totalPages"
      class="flex items-center justify-center gap-2 bg-green-600 text-white py-2 px-4 rounded-xl hover:bg-green-700 disabled:opacity-50 transition">
      {{ 'ADMIN_USERS.PAGINATION.NEXT' | translate }}
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</mat-card>
