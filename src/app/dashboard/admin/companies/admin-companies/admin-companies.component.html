<!-- admin-companies.component.html -->
<mat-card class="p-4">
  <div class="flex justify-between items-center mb-4">
    <input type="text" placeholder="Buscar compañía..." (keyup)="applyFilter($event)"
      class="border rounded px-3 py-2 w-64" />
    <button mat-raised-button color="accent" [routerLink]="['/admin/company-form']">
      <mat-icon class="mr-1">add</mat-icon>
      Nueva compañía
    </button>
  </div>

  <table mat-table [dataSource]="companies" matSort>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let company">{{ company.name }}</td>
    </ng-container>

    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>address</th>
      <td mat-cell *matCellDef="let company">{{ company.address || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let company" class="space-x-2">
        <button mat-icon-button color="primary" (click)="onEdit(company)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(company)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
</mat-card>
