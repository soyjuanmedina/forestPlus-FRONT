<mat-card class="p-4">
  <div class="flex justify-between items-center mb-4">
    <input type="text" placeholder="Buscar compañía..." [(ngModel)]="filterText"
      (keyup)="applyFilter()" class="border rounded px-3 py-2 w-64" />
    <button mat-raised-button color="accent" (click)="addCompany()">
      <mat-icon class="mr-1">add</mat-icon>
      Nueva compañía
    </button>
  </div>

  <div class="flex flex-col gap-4">
    <div *ngFor="let company of getPagedCompanies()"
      class="border rounded p-4 shadow-sm flex justify-between items-center w-full">
      <div class="flex flex-col text-left">
        <div class="font-semibold text-lg">{{ company.name }}</div>
        <div class="text-gray-600">{{ company.address || '—' }}</div>
      </div>

      <div class="flex gap-2">

        <!-- Ver -->
        <button mat-mini-fab (click)="onView(company)"
          class="bg-blue-500 hover:bg-blue-600 text-white">
          <mat-icon>visibility</mat-icon>
        </button>

        <button mat-mini-fab color="primary" (click)="onEdit(company)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-mini-fab color="warn" (click)="onDelete(company)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="mt-4 flex justify-center items-center gap-2">
    <button mat-stroked-button (click)="previousPage()" [disabled]="currentPage === 0">
      Anterior
    </button>
    <span>{{ currentPage + 1 }} / {{ totalPages }}</span>
    <button mat-stroked-button (click)="nextPage()" [disabled]="currentPage + 1 >= totalPages">
      Siguiente
    </button>
  </div>
</mat-card>
