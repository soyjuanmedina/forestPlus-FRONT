<mat-card class="p-4">
  <div class="flex justify-between items-center mb-4">
    <input type="text" placeholder="Buscar compañía..." [(ngModel)]="filterText"
      (keyup)="applyFilter()"
      class="w-64 rounded-xl border border-gray-300 px-4 py-2 shadow-sm
         focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition" />
    <button (click)="addCompany()"
      class="flex items-center justify-center gap-2 bg-green-600 text-white py-3 px-4 rounded-xl hover:bg-green-700 disabled:opacity-50 transition">
      <mat-icon>add</mat-icon>
      Nuevo usuario
    </button>
  </div>

  <div class="flex flex-col gap-4">
    <div *ngFor="let company of getPagedCompanies()"
      class="border rounded p-4 shadow-sm flex justify-between items-center w-full">
      <div class="flex flex-col text-left">
        <div class="font-semibold text-lg">{{ company.name }}</div>
        <div class="text-gray-600">{{ company.address || '—' }}</div>
      </div>

      <div class="flex gap-2">

        <!-- Ver -->
        <button mat-mini-fab (click)="onView(company)"
          class="bg-blue-500 hover:bg-blue-600 text-white">
          <mat-icon>visibility</mat-icon>
        </button>

        <button mat-mini-fab color="primary" (click)="onEdit(company)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-mini-fab color="warn" (click)="onDelete(company)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="mt-6 flex justify-center items-center gap-4">
    <button (click)="previousPage()" [disabled]="currentPage === 0"
      class="flex items-center justify-center gap-2 bg-green-600 text-white py-2 px-4 rounded-xl hover:bg-green-700 disabled:opacity-50 transition">
      <mat-icon>chevron_left</mat-icon>
      Anterior
    </button>

    <span class="text-gray-700 font-medium">{{ currentPage + 1 }} / {{ totalPages }}</span>

    <button (click)="nextPage()" [disabled]="currentPage + 1 >= totalPages"
      class="flex items-center justify-center gap-2 bg-green-600 text-white py-2 px-4 rounded-xl hover:bg-green-700 disabled:opacity-50 transition">
      Siguiente
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

</mat-card>
