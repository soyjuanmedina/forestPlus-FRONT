<div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
  <h2 class="text-2xl font-bold text-green-700 text-center mb-6">
    {{ isEditMode ? 'Editar Compañía' : 'Nueva Compañía' }}
  </h2>

  <form [formGroup]="companyForm" (ngSubmit)="onSubmit()"
    class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <!-- Logo / Imagen -->
    <div class="md:col-span-2 flex flex-col items-center mb-4">
      <img [src]="previewImage || 'assets/logo-white.png'" alt="Logo"
        class="w-24 h-24 rounded-full shadow-lg mb-2" />
      <label
        class="cursor-pointer bg-gray-200 hover:bg-gray-300 p-2 rounded-full flex items-center gap-2">
        <mat-icon>photo_camera</mat-icon>
        <span>Seleccionar imagen</span>
        <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden />
      </label>
    </div>

    <!-- Nombre -->
    <div class="md:col-span-2">
      <label class="block text-gray-700 mb-1">Nombre</label>
      <input type="text" formControlName="name" placeholder="Nombre de la compañía"
        class="w-full px-4 py-2 border-b border-gray-300 focus:border-green-500 focus:outline-none bg-transparent">
      <div *ngIf="companyForm.get('name')?.invalid && companyForm.get('name')?.touched"
        class="text-red-500 text-sm mt-1">El nombre es obligatorio</div>
    </div>

    <!-- Dirección -->
    <div class="md:col-span-2">
      <label class="block text-gray-700 mb-1">Dirección</label>
      <input type="text" formControlName="address" placeholder="Dirección de la compañía"
        class="w-full px-4 py-2 border-b border-gray-300 focus:border-green-500 focus:outline-none bg-transparent">
    </div>

    <!-- Admin de la compañía -->
    <div>
      <label class="block text-gray-700 mb-1">Administrador</label>
      <select formControlName="adminId"
        class="w-full px-4 py-2 border-b border-gray-300 focus:border-green-500 focus:outline-none bg-transparent">
        <option value="">Selecciona un administrador</option>
        <option *ngFor="let a of admins" [value]="a.id">{{ a.name }} {{ a.surname }}</option>
      </select>
      <div *ngIf="admins.length === 0" class="text-red-500 text-sm mt-1">
        Para crear una compañía, primero debes crear un usuario con rol 'administrador de compañía'.
      </div>
    </div>

    <!-- Botón -->
    <div class="md:col-span-2 mt-4">
      <button type="submit"
        class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 disabled:opacity-50">
        {{ isEditMode ? 'Actualizar Compañía' : 'Crear Compañía' }}
      </button>
    </div>
  </form>

  <!-- Mensajes -->
  <div *ngIf="registerSuccess" class="text-center text-green-600 font-semibold text-lg mt-4">
    Compañía guardada con éxito
  </div>
  <div *ngIf="registerError" class="text-center text-red-500 mt-4">
    {{ registerError }}
  </div>
</div>
