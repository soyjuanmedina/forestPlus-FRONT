<form (ngSubmit)="saveChanges()" class="w-full max-w-2xl mx-auto p-4">
  <!-- Nombre -->
  <mat-form-field appearance="outline" class="w-full mb-2">
    <mat-label>Nombre de la empresa</mat-label>
    <input matInput [(ngModel)]="editData.name" name="name" />
  </mat-form-field>

  <!-- Dirección -->
  <mat-form-field appearance="outline" class="w-full mb-2">
    <mat-label>Dirección</mat-label>
    <input matInput [(ngModel)]="editData.address" name="address" />
  </mat-form-field>

  <!-- Logo -->
  <div class="mb-4">
    <label class="block mb-1 font-medium">Logo / Imagen</label>
    <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    <div *ngIf="previewImage || company?.picture" class="mt-2">
      <img [src]="previewImage || company?.picture" alt="Logo de la empresa"
        class="max-h-40 mx-auto" />
    </div>
  </div>

  <div class="flex gap-2 mt-4 justify-center">
    <button mat-raised-button color="primary" type="submit">Guardar</button>
  </div>
</form>

<hr class="my-6" />

<!-- CO2 -->
<div *ngIf="co2Years?.length">
  <h2 class="text-xl font-bold mb-4 text-center">Emisiones de CO₂ por año</h2>

  <!-- Último año -->
  <div *ngIf="co2Years.length" class="mb-8 border p-4 rounded shadow-sm">
    <h3 class="font-semibold mb-2">Último año registrado: {{ co2Years[0].year }}</h3>

    <div class="flex justify-end mb-2">
      <button mat-stroked-button color="primary" (click)="toggleEditCO2(co2Years[0])">
        {{ co2Years[0].editMode ? 'Cancelar' : 'Editar' }}
      </button>
    </div>

    <div *ngIf="co2Years[0].editMode" class="flex gap-4 mb-2 justify-center">
      <mat-form-field appearance="outline">
        <mat-label>Emitido</mat-label>
        <input matInput type="number" [(ngModel)]="co2Years[0].editEmissions" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Compensado</mat-label>
        <input matInput type="number" [(ngModel)]="co2Years[0].editCompensations" />
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="saveCO2(co2Years[0])">Guardar</button>
    </div>

    <div class="flex gap-4 justify-center mb-2">
      <div class="text-center">
        <canvas [id]="co2Years[0].emitidoRef"></canvas>
        <div>Emitido</div>
      </div>
      <div class="text-center">
        <canvas [id]="co2Years[0].compensadoRef"></canvas>
        <div>Compensado</div>
      </div>
      <div class="text-center">
        <canvas [id]="co2Years[0].netoRef"></canvas>
        <div>Neto</div>
      </div>
    </div>
  </div>

  <!-- Años anteriores -->
  <div *ngFor="let y of co2Years.slice(1)" class="mb-6 border p-4 rounded shadow-sm">
    <h3 class="font-semibold mb-2">Año {{ y.year }}</h3>
    <div class="flex justify-end mb-2">
      <button mat-stroked-button color="primary" (click)="toggleEditCO2(y)">
        {{ y.editMode ? 'Cancelar' : 'Editar' }}
      </button>
    </div>
    <div *ngIf="y.editMode" class="flex gap-4 mb-2 justify-center">
      <mat-form-field appearance="outline">
        <mat-label>Emitido</mat-label>
        <input matInput type="number" [(ngModel)]="y.editEmissions" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Compensado</mat-label>
        <input matInput type="number" [(ngModel)]="y.editCompensations" />
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="saveCO2(y)">Guardar</button>
    </div>

    <div class="flex gap-4 justify-center mb-2">
      <div class="text-center">
        <canvas [id]="y.emitidoRef" width="80" height="80"></canvas>
        <div>Emitido</div>
      </div>
      <div class="text-center">
        <canvas [id]="y.compensadoRef" width="80" height="80"></canvas>
        <div>Compensado</div>
      </div>
      <div class="text-center">
        <canvas [id]="y.netoRef" width="80" height="80"></canvas>
        <div>Neto</div>
      </div>
    </div>
  </div>

  <!-- Añadir nuevo año -->
  <div class="border p-4 rounded shadow-sm text-center">
    <mat-form-field appearance="outline">
      <mat-label>Año</mat-label>
      <mat-select [(ngModel)]="selectedYear" name="newYear">
        <mat-option *ngFor="let y of availableYears" [value]="y">{{ y }}</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="addNewYear(selectedYear)">Añadir año</button>
  </div>
</div>
