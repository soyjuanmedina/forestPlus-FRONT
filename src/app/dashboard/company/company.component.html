<mat-card class="rounded-2xl shadow-md p-4 flex flex-col items-center text-center">

  <!-- PERFIL DE LA COMPAÑÍA -->
  <img [src]="previewImage || user.company.picture || 'assets/company_profile.png'" alt="Logo"
    class="w-24 h-24 rounded-full shadow-lg mb-4" />

  <!-- MODO LECTURA / EDICIÓN DEL PERFIL -->
  <ng-container *ngIf="!editMode; else editForm">
    <h2 class="text-xl font-semibold">{{ user.company.name }}</h2>
    <p class="text-gray-500">{{ user.company.address }}</p>

    <div class="flex gap-2 mt-4" *ngIf="user.role === 'COMPANY_ADMIN'">
      <button mat-raised-button color="primary" (click)="toggleEdit()">Editar</button>
    </div>
  </ng-container>

  <ng-template #editForm>
    <form (ngSubmit)="saveChanges()" class="w-full">
      <mat-form-field appearance="outline" class="w-full mb-2">
        <mat-label>Nombre de la empresa</mat-label>
        <input matInput [(ngModel)]="editData.name" name="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full mb-2">
        <mat-label>Dirección</mat-label>
        <input matInput [(ngModel)]="editData.address" name="address" />
      </mat-form-field>

      <div class="flex gap-2 mt-4 justify-center">
        <button mat-raised-button color="primary" type="submit">Guardar</button>
        <button mat-stroked-button color="warn" type="button"
          (click)="toggleEdit()">Cancelar</button>
      </div>
    </form>
  </ng-template>

  <div class="w-full mt-6" *ngIf="lastCO2Year">
    <h3 class="text-lg font-semibold">Emisiones del último año</h3>
    <p class="text-gray-400">{{ lastCO2Year.year }}</p>



    <div class="flex gap-8 justify-center items-center">
      <div class="flex flex-col items-center">
        <canvas baseChart [data]="emitidoData" [labels]="emitidoLabels" [chartType]="emitidoType"
          [options]="emitidoOptions">
        </canvas>
        <p>{{ lastCO2Year?.emissions?.total ?? 0 }} t CO₂ emitido</p>
      </div>

      <div class="flex flex-col items-center">
        <canvas baseChart [data]="compensadoData" [labels]="compensadoLabels"
          [chartType]="compensadoType" [options]="compensadoOptions">
        </canvas>
        <p>{{ lastCO2Year?.compensations?.total ?? 0 }} t CO₂ compensado</p>
      </div>

      <div class="flex flex-col items-center">
        <canvas baseChart [data]="netoData" [labels]="netoLabels" [chartType]="netoType"
          [options]="netoOptions">
        </canvas>
        <p>{{ totalCO2 ?? 0 }} t CO₂ neto</p>
      </div>
    </div>








  </div>

</mat-card>
