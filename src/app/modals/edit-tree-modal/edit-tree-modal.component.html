<div class="p-6 w-full max-w-md bg-white rounded-2xl shadow-lg">

  <h2 class="text-2xl font-bold text-green-700 mb-6 text-center">
    {{ 'EDIT_TREE.TITLE' | translate }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="save()">

    <!-- Tipo de árbol primero -->
    <label class="block text-gray-700 mb-1">{{ 'EDIT_TREE.TYPE' | translate }}</label>
    <select formControlName="treeTypeId" class="w-full mb-4 border rounded-xl p-2"
      (change)="onTreeTypeChange()">
      <option *ngFor="let t of treeTypes" [value]="t.id">
        {{ t.name }}
      </option>
    </select>

    <!-- Especie opcional -->
    <label class="block text-gray-700 mb-1">{{ 'EDIT_TREE.SPECIES' | translate }}</label>
    <input formControlName="species" class="w-full mb-4 border rounded-xl p-2"
      placeholder="{{ 'EDIT_TREE.SPECIES_PLACEHOLDER' | translate }}" />

    <!-- Fecha de plantación -->
    <label class="block text-gray-700 mb-1">{{ 'EDIT_TREE.PLANTED_AT' | translate }}</label>
    <input type="date" formControlName="plantedAt" class="w-full mb-4 border rounded-xl p-2" />

    <!-- CO2, solo lectura -->
    <label class="block text-gray-700 mb-1">{{ 'EDIT_TREE.CO2' | translate }}</label>
    <input type="number" formControlName="co2Absorption"
      class="w-full mb-6 border rounded-xl p-2 bg-gray-100" readonly />

    <div class="flex justify-end gap-4">
      <button type="button" (click)="close()"
        class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 transition">
        {{ 'COMMON.CANCEL' | translate }}
      </button>

      <button type="submit" [disabled]="form.invalid"
        class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 disabled:opacity-50 transition">
        {{ 'COMMON.SAVE' | translate }}
      </button>
    </div>

  </form>

</div>
