<div class="p-6 w-full max-w-md bg-white rounded-2xl shadow-lg">

  <!-- Título -->
  <h2 class="text-2xl font-bold text-green-700 mb-6 text-center">
    {{ 'ASSIGN_TREES.TITLE' | translate }}
  </h2>

  valid: {{form.valid}}

  <form [formGroup]="form" (ngSubmit)="submit()">

    <!-- Selección de terreno -->
    <div class="mb-6">
      <label class="block text-gray-700 mb-1">{{ 'ASSIGN_TREES.LAND' | translate }}</label>
      <select formControlName="landId" class="w-full rounded-xl border border-gray-300 p-2"
        (change)="onLandChange($event)">
        <option *ngFor="let land of lands" [value]="land.id">{{ land.name }}</option>
      </select>
    </div>

    <div class="mb-6" *ngIf="plannedPlantations?.length">
      <label class="block text-gray-700 mb-1">
        {{ 'ASSIGN_TREES.PLANNED_PLANTATION' | translate }}
      </label>

      <select formControlName="plannedPlantationId"
        class="w-full rounded-xl border border-gray-300 p-2">

        <option [ngValue]="null" disabled>
          {{ 'COMMON.SELECT_OPTION' | translate }}
        </option>

        <option *ngFor="let pp of plannedPlantations" [value]="pp.id">
          {{ pp.plannedDate | date:'dd/MM/yyyy' }}
          · {{ pp.maxTrees }} {{ 'PLANNED_PLANTATION.MAX_TREES' | translate }}
        </option>
      </select>
    </div>

    <!-- Selección de tipo de árbol -->
    <div class="mb-6" *ngIf="form.get('plannedPlantationId')?.value && treeTypes?.length">
      <label class="block text-gray-700 mb-1">{{ 'PLANT_TREES.TREE_TYPE' | translate }}</label>
      <select formControlName="treeTypeId" class="w-full rounded-xl border border-gray-300 p-2">
        <option [ngValue]="null" disabled>{{ 'COMMON.SELECT_OPTION' | translate }}</option>
        <option *ngFor="let tree of treeTypes" [value]="tree.id">{{ tree.name }}</option>
      </select>
    </div>


    <!-- Cantidad -->
    <div class="mb-6" *ngIf="form.get('plannedPlantationId')?.value">
      <label class="block text-gray-700 mb-1">
        {{ 'ASSIGN_TREES.QUANTITY' | translate }}
      </label>

      <input type="number" formControlName="quantity" min="1"
        placeholder="{{ 'ASSIGN_TREES.QUANTITY' | translate }}"
        class="w-full px-0 py-2 border-b border-gray-300 focus:border-green-500 bg-transparent outline-none" />
    </div>

    <!-- Botones -->
    <div class="flex justify-end gap-4 mt-8">
      <button type="button" (click)="dialogRef.close()"
        class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 transition">
        {{ 'COMMON.CANCEL' | translate }}
      </button>

      <button type="submit" [disabled]="form.invalid"
        class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 disabled:opacity-50 transition">
        {{ 'ASSIGN_TREES.ASSIGN' | translate }}
      </button>
    </div>
  </form>
</div>
