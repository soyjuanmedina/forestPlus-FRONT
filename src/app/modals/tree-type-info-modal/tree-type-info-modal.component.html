<h2 mat-dialog-title>Información del Árbol</h2>

<mat-dialog-content>
  <p><strong>Especie:</strong> {{ data.tree?.scientificName }}</p>
  <p><strong>Altura:</strong> {{ data.tree?.height }} m</p>
  <p><strong>Edad Aproximada:</strong> {{ data.tree?.age }} años</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition"
    mat-dialog-close>
    Cerrar
  </button>
</mat-dialog-actions>
