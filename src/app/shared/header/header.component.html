<header
  class="flex items-center justify-between bg-gradient-to-r from-teal-500 to-green-500 text-white p-4 shadow-md">

  <!-- Botón menú mobile -->
  <button class="md:hidden" (click)="onToggleSidebar()">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
      stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Título -->
  <span class="font-bold">{{ 'DASHBOARD.DASHBOARD' | translate }}</span>

  <!-- Controles -->
  <div class="flex items-center space-x-4">

    <!-- Botón Logout -->
    <button (click)="logout()"
      class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-white font-semibold">
      {{ 'DASHBOARD.LOGOUT' | translate }}
    </button>

    <!-- Selector de idioma -->
    <div class="language-switcher">
      <button [class.active]="selectedLang === 'es'" (click)="switchLanguage('es')">ES</button>
      <button [class.active]="selectedLang === 'en'" (click)="switchLanguage('en')">EN</button>
    </div>

  </div>
</header>
