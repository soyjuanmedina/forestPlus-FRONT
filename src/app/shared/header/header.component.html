<header class="flex flex-col md:flex-row
         md:items-center md:justify-between
         bg-gradient-to-r from-teal-500 to-green-500
         text-white p-4 shadow-md">

  <!-- LOGO (arriba en mobile, izquierda en desktop) -->
  <div class="flex justify-center md:justify-start mb-3 md:mb-0">
    <img src="assets/logo-forestplus.png" alt="forest+ Logo" class="logo" />
  </div>

  <!-- FILA INFERIOR EN MOBILE / DERECHA EN DESKTOP -->
  <div class="flex items-center justify-between md:justify-end
           space-x-4 w-full md:w-auto">

    <!-- Botón menú mobile -->
    <button class="md:hidden" (click)="onToggleSidebar()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Usuario -->
    <ng-container *ngIf="currentUser$ | async as user">
      <div class="flex items-center gap-2">
        <img [src]="user.picture || 'assets/default-avatar.png'" alt="Usuario"
          class="h-8 w-8 rounded-full border border-white">

        <!-- Ocultamos apellido en pantallas muy pequeñas -->
        <span class="font-medium hidden sm:inline">
          {{ user.name }} {{ user.surname }}
        </span>
      </div>
    </ng-container>

    <!-- Botón Logout -->
    <button (click)="logout()" class="flex items-center gap-1
             bg-red-600 text-white
             py-1 px-3 rounded
             hover:bg-red-700
             transition font-semibold text-sm">
      {{ 'DASHBOARD.LOGOUT' | translate }}
      <mat-icon class="text-base">logout</mat-icon>
    </button>

    <!-- Selector de idioma -->
    <div class="language-switcher flex gap-1">
      <button [class.active]="selectedLang === 'es'" (click)="switchLanguage('es')">
        ES
      </button>
      <button [class.active]="selectedLang === 'en'" (click)="switchLanguage('en')">
        EN
      </button>
    </div>

  </div>
</header>
