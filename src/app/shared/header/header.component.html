<header
  class="flex items-center justify-between bg-gradient-to-r from-teal-500 to-green-500 text-white p-4 shadow-md">
  <button class="md:hidden" (click)="onToggleSidebar()">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
      stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
  <span class="font-bold">{{ 'DASHBOARD.DASHBOARD' | translate }}</span>
  <div class="language-switcher">
    <button [class.active]="selectedLang === 'es'" (click)="switchLanguage('es')">ES</button>
    <button [class.active]="selectedLang === 'en'" (click)="switchLanguage('en')">EN</button>
  </div>
</header>
