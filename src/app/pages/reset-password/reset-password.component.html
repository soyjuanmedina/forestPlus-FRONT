<div class="flex flex-col items-center justify-start min-h-screen bg-gray-100 pt-16">

  <!-- Logo -->
  <div class="flex flex-col items-center mb-4">
    <img src="assets/logo.png" alt="Forest+ Logo" class="h-24 w-24" />
  </div>

  <div class="w-full max-w-md p-6 bg-white shadow-lg rounded-2xl">
    <h1 class="text-2xl font-bold text-green-700 text-center mb-6">
      Cambiar contraseña
    </h1>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">

      <!-- Nueva contraseña -->
      <div class="mb-4">
        <label for="newPassword" class="block text-gray-700 mb-1">Nueva contraseña</label>
        <input id="newPassword" type="password" formControlName="newPassword"
          placeholder="Ingresa tu nueva contraseña"
          class="w-full px-4 py-2 border-b border-gray-300 focus:border-green-500 focus:outline-none bg-transparent">
        <div *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
          class="text-red-500 text-sm mt-1">
          <div *ngIf="resetForm.get('newPassword')?.hasError('required')">La nueva contraseña es
            requerida</div>
          <div *ngIf="resetForm.get('newPassword')?.hasError('minlength')">La contraseña debe tener
            al menos 6 caracteres</div>
        </div>
      </div>

      <!-- Confirmar nueva contraseña -->
      <div class="mb-6">
        <label for="confirmPassword" class="block text-gray-700 mb-1">Confirmar nueva
          contraseña</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword"
          placeholder="Confirma tu nueva contraseña"
          class="w-full px-4 py-2 border-b border-gray-300 focus:border-green-500 focus:outline-none bg-transparent">
        <div
          *ngIf="resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched"
          class="text-red-500 text-sm mt-1">
          <div *ngIf="resetForm.get('confirmPassword')?.hasError('required')">Confirma la nueva
            contraseña</div>
        </div>
      </div>

      <!-- Botón de submit -->
      <button type="submit"
        class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 disabled:opacity-50"
        [disabled]="resetForm.invalid">
        Cambiar contraseña
      </button>
    </form>

    <!-- Mensajes de error / éxito -->
    <div *ngIf="errorMessage" class="text-center text-red-500 mt-4">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="text-center text-green-600 mt-4">{{ successMessage }}</div>

    <!-- Link opcional a login -->
    <p class="text-center text-gray-500 mt-4">
      ¿Recordaste tu contraseña?
      <a [routerLink]="['../login']" class="text-blue-500 font-semibold hover:underline">
        Inicia sesión
      </a>
    </p>
  </div>
</div>
